name: CI

on:
  push:
    branches: [main, 'app/**']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -j 2
      - name: Test
        run: swift test -j 2

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('App/project.yml', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd App
          xcodegen generate

      # MLX requires a real Metal GPU family and is not buildable for the
      # iOS Simulator (mlx-swift running-on-ios.md). Build for a generic iOS
      # device destination — compile-only, no signing.
      - name: Build iOS app
        run: |
          xcodebuild \
            -project App/LocalAI.xcodeproj \
            -scheme LocalAI \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run LocalAICore tests on macOS
        run: swift test -j 2
