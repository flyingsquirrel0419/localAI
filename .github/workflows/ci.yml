name: CI

on:
  push:
    branches: [main, 'app/**']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # JavaScriptRuntimeTests (merged from main) spawn real node/npm processes;
      # the bare swift:6.1 container doesn't ship Node.js.
      - name: Install Node.js
        run: |
          apt-get update -qq
          apt-get install -y -qq nodejs npm
      - name: Build
        run: swift build -j 2
      - name: Test
        run: swift test -j 2

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          ls /Applications | grep -i xcode || true
          # libgit2.swift (Git2 product) requires swift-tools 6.2 → Xcode 26.
          # Prefer the newest available Xcode 26, then fall back to 16.x.
          for app in /Applications/Xcode_26.4.app /Applications/Xcode_26.3.app \
                     /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app \
                     /Applications/Xcode_26.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          if ! xcodebuild -version 2>/dev/null | grep -q "Xcode 26"; then
            if [ -d /Applications/Xcode_16.4.app ]; then
              sudo xcode-select -s /Applications/Xcode_16.4.app
            else
              sudo xcode-select -s /Applications/Xcode.app
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('App/project.yml', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd App
          xcodegen generate

      # MLX requires a real Metal GPU family and is not buildable for the
      # iOS Simulator (mlx-swift running-on-ios.md). Build for a generic iOS
      # device destination — compile-only, no signing.
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project App/LocalAI.xcodeproj \
            -scheme LocalAI \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          # Surface the real failure lines; grep alone swallows exit codes.
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sort -u || true
            exit 1
          fi

      - name: Run LocalAICore tests on macOS
        run: swift test -j 2
