name: CI

on:
  push:
    branches: [main, 'app/**']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # JavaScriptRuntimeTests (merged from main) spawn real node/npm processes;
      # the bare swift:6.1 container doesn't ship Node.js. Use setup-node with
      # Node 18 to match what nodejs-mobile ships on iOS (v18.20.4).
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build LocalAICore
        run: swift build -j 2
      - name: Test LocalAICore
        run: swift test -j 2
      - name: NodeHost unit tests
        run: node --test NodeHost/test/*.test.js

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          ls /Applications | grep -i xcode || true
          # libgit2.swift (Git2 product) requires swift-tools 6.2 → Xcode 26.
          # Prefer the newest available Xcode 26, then fall back to 16.x.
          for app in /Applications/Xcode_26.4.app /Applications/Xcode_26.3.app \
                     /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app \
                     /Applications/Xcode_26.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          if ! xcodebuild -version 2>/dev/null | grep -q "Xcode 26"; then
            if [ -d /Applications/Xcode_16.4.app ]; then
              sudo xcode-select -s /Applications/Xcode_16.4.app
            else
              sudo xcode-select -s /Applications/Xcode.app
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('App/project.yml', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # NodeMobile.xcframework is a binary release artefact (~51 MB zip,
      # ~180 MB unzipped). Cache it by release tag so we only download when
      # the version changes.
      - name: Cache NodeMobile
        id: cache-nodemobile
        uses: actions/cache@v4
        with:
          path: App/Frameworks/NodeMobile.xcframework
          key: nodemobile-v18.20.4

      - name: Download NodeMobile
        if: steps.cache-nodemobile.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p App/Frameworks
          curl -sSfL -o /tmp/nodejs-mobile-ios.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-ios.zip
          unzip -q /tmp/nodejs-mobile-ios.zip 'NodeMobile.xcframework/*' -d App/Frameworks
          rm /tmp/nodejs-mobile-ios.zip
          # Sanity check: the framework's public header must declare node_start.
          grep -q "int node_start" \
            App/Frameworks/NodeMobile.xcframework/ios-arm64/NodeMobile.framework/Headers/NodeMobile.h

      # Verify the BackgroundTasks APIs we use actually exist in the SDK the
      # runner ships, and print the exact declarations so the Swift-facing API
      # surface (init signatures, request properties, progress/completion
      # methods) is reviewable in the CI log.
      - name: Verify iOS 26 BackgroundTasks API
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          HEADERS_DIR="$SDK_PATH/System/Library/Frameworks/BackgroundTasks.framework/Headers"
          echo "SDK: $SDK_PATH"
          ls "$HEADERS_DIR" || true
          if xcodebuild -version | grep -q "Xcode 26"; then
            if grep -rq "BGContinuedProcessingTask" "$HEADERS_DIR"; then
              echo "=== BGContinuedProcessingTask declarations ==="
              grep -r -B 2 -A 12 "BGContinuedProcessingTask" "$HEADERS_DIR" || true
              echo "=== end ==="
            else
              echo "::warning::BGContinuedProcessingTask not present in SDK headers (Xcode 26 SDK). The iOS 26 code path in BackgroundTaskCoordinator will be compiled out at the SDK boundary; begin/end background task protection still applies."
            fi
          else
            echo "Xcode < 26 selected; BGContinuedProcessingTask path will be compiled out."
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd App
          xcodegen generate

      # MLX requires a real Metal GPU family and is not buildable for the
      # iOS Simulator (mlx-swift running-on-ios.md). Build for a generic iOS
      # device destination — compile-only, no signing.
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project App/LocalAI.xcodeproj \
            -scheme LocalAI \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          # Surface the real failure lines; grep alone swallows exit codes.
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sort -u || true
            exit 1
          fi

      # Prove the Node runtime actually shipped in the bundle — that the
      # framework was embedded, the NodeHost folder reference was copied, and
      # the app binary links NodeMobile (i.e. `#if canImport(NodeMobile)` was
      # true, so NodeMobileLauncher compiled its real path, not the fallback).
      - name: Assert Node runtime in built app
        run: |
          set -e
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*Build/Products/Debug-iphoneos/LocalAI.app' -maxdepth 6 \
            -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Built LocalAI.app not found in DerivedData"
            exit 1
          fi
          echo "Built app: $APP_PATH"
          test -d "$APP_PATH/Frameworks/NodeMobile.framework" \
            || { echo "::error::Frameworks/NodeMobile.framework missing from LocalAI.app"; exit 1; }
          test -f "$APP_PATH/NodeHost/host.js" \
            || { echo "::error::NodeHost/host.js missing from LocalAI.app"; exit 1; }
          # Debug builds put the app code in LocalAI.debug.dylib; the thin
          # launcher binary links almost nothing. Check both for the
          # NodeMobile reference.
          BINARIES="$APP_PATH/LocalAI"
          [ -f "$APP_PATH/LocalAI.debug.dylib" ] && BINARIES="$BINARIES $APP_PATH/LocalAI.debug.dylib"
          otool -L $BINARIES | tee otool.log
          if grep -q "NodeMobile" otool.log; then
            echo "Binary links NodeMobile dynamically."
          elif nm -gU $BINARIES 2>/dev/null | grep -q "_node_start"; then
            # Static framework: no dynamic reference, but the symbol is
            # linked into the binary — still proves canImport(NodeMobile).
            echo "node_start symbol linked into binary (static NodeMobile)."
          else
            echo "::error::LocalAI binary neither links NodeMobile nor contains node_start — canImport(NodeMobile) was false at build time"
            exit 1
          fi
          echo "Node runtime present: NodeMobile.framework embedded, NodeHost bundled, binary references NodeMobile."

      # JavaScriptRuntime/NodeHostRuntime/AgentAcceptance tests spawn node/npm.
      # /usr/bin is SIP read-only on macOS, so core resolves node from PATH
      # (NodePathResolver); ensure a current Node is on PATH via Homebrew.
      - name: Install Node.js for macOS tests
        run: |
          brew install node
          node --version

      - name: Run LocalAICore tests on macOS
        run: swift test -j 2

      - name: NodeHost unit tests
        run: node --test NodeHost/test/*.test.js
