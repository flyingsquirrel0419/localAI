name: LocalAI
options:
  bundleIdPrefix: com.localai
  deploymentTarget:
    iOS: "17.0"

packages:
  LocalAICore:
    path: ..

targets:
  LocalAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: LocalAICore
        product: LocalAICore
    info:
      path: Generated/Info.plist
      generating: true
      properties:
        CFBundleDisplayName: LocalAI
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
